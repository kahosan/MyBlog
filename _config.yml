# Hexo Configuration
# Docs: https://hexo.io/docs/configuration.html

# ───────────────────────────────
# Site
# ───────────────────────────────
title: かほさん的树洞
subtitle: ""
description: ""
keywords:
author: kaho
language: zh-cn
timezone: Asia/Shanghai

# ───────────────────────────────
# URL
# ───────────────────────────────
url: https://blog.kahosan.top
root: /
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true # Set to false to remove trailing 'index.html' from permalinks
  trailing_html: true # Set to false to remove trailing '.html' from permalinks

# ───────────────────────────────
# Directory
# ───────────────────────────────
about_dir: about
util_dir: util
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# ───────────────────────────────
# Writing
# ───────────────────────────────
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ""
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true

# ───────────────────────────────
# 代码高亮（Prism.js）
# ───────────────────────────────
syntax_highlighter: prismjs
prismjs:
  preprocess: true
  line_number: true
  line_threshold: 0
  tab_replace: ""

# ───────────────────────────────
# Home Page
# ───────────────────────────────
index_generator:
  path: ""
  per_page: 5
  order_by: -date

# ───────────────────────────────
# Category & Tag
# ───────────────────────────────
default_category: uncategorized
category_map:
tag_map:

meta_generator: true

# ───────────────────────────────
# Date / Time
# ───────────────────────────────
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: "mtime"

# ───────────────────────────────
# Pagination
# ───────────────────────────────
per_page: 10
pagination_dir: page

# ───────────────────────────────
# Theme
# ───────────────────────────────
theme: typography

# ───────────────────────────────
# Archive Generator
# ───────────────────────────────
archive_generator:
  per_page: 0

# ───────────────────────────────
# Category Generator
# ───────────────────────────────
category_generator:
  per_page: 10
  enable_index_page: true

# ───────────────────────────────
# Tag Generator
# ───────────────────────────────
tag_generator:
  per_page: 10
  enable_index_page: true

# ───────────────────────────────
# Feed (hexo-generator-feed)
# ───────────────────────────────
feed:
  enable: true
  type: atom
  path: atom.xml
  limit: 20
  content_limit: 140
  content_limit_delim: " "
  order_by: -date
  icon: icon.png
  autodiscovery: true

# ───────────────────────────────
# Sitemap (hexo-generator-sitemap)
# ───────────────────────────────
sitemap:
  path:
    - sitemap.xml
    - sitemap.txt
  template: ./sitemap_template.xml
  template_txt: ./sitemap_template.txt
  rel: false
  tags: true
  categories: true

# ───────────────────────────────
# Robots (hexo-generator-robotstxt)
# ───────────────────────────────
robotstxt:
  useragent: "*"
  disallow:
    - /ping
    - /beacon
    - /js/jquery.js
    - /data
    - /disqus
    - "*.md"
  allow:
    - /
  sitemap: https://blog.kahosan.top/sitemap.xml
